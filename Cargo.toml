[package]
name = "miyu-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "AGPL-3.0-or-later"
description = "Miyu 的渲染软件包：把 Markdown 画成图（长文转图、render_image）。"

[[bin]]
name = "miyu-render"
path = "src/main.rs"

[dependencies]
# 跟核心说的是一行一条的 JSON-RPC（作者说明第四节）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 画好的图经 blob.put 交给核心：字节写成 base64。
base64 = "0.22"
# 读 Markdown（设计 36 第三节的图，同旧版）。
pulldown-cmark = { version = "0.13.5", default-features = false }
# 排字、画字形（同旧版）：字体库 fontdb 随它来，`cosmic_text::fontdb`。
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# mermaid（设计 36 第四节第 2 条，同旧版）：出 SVG，配色照页面；不要它的命令行和它自己出 PNG 的那一套。
mermaid-rs-renderer = { version = "0.3", default-features = false }
# SVG 画成透明的图（同旧版）：字体库和排字共用一份（同一个 fontdb 版本），不另扫系统字体。
resvg = { version = "0.47", default-features = false, features = ["text"] }
# 公式（设计 36 第四节第 4 条，旧版终端在用）：纯 Rust 的 LaTeX，KaTeX 的字体编进程序，不靠系统装了什么。
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
# 代码着色（设计 36 第四节第 5 条）：纯 Rust 的正则（fancy-regex），三个平台不用编 C；只要它认语言、切词，颜色照页面的配色调，
# 不用它自带的主题。
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
# render_image 存图的文件名里的内容哈希：跨版本不变（标准库的哈希不保证），依赖树里本来就有。
sha2 = "0.11"
# 画布和 PNG：只开 PNG。
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
